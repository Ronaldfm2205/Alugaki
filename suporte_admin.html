<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Suporte ALUGAKI</title>
  <style>
    :root {
      --bg: #0f0d1b;
      --bg-soft: #171427;
      --surface: #171427;
      --surface-strong: #1e1b31;
      --primary: #7c5cff;
      --primary-strong: #9a7dff;
      --text: #f4f1ff;
      --muted: #b7afd8;
      --border: rgba(255, 255, 255, 0.08);
      --warning: #f59e0b;
      --success: #1f9d64;
      --danger: #dc2626;
      --panel-alt: #120f1d;
      --input-bg: #120f1d;
      --shadow: rgba(12, 10, 22, 0.45);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #1c1730 0%, var(--bg) 42%);
      color: var(--text);
    }

    .shell {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 16px 48px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(23, 20, 39, 0.88);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px var(--shadow);
      backdrop-filter: blur(10px);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat {
      background: rgba(23, 20, 39, 0.9);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(12, 10, 22, 0.28);
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary-strong);
    }

    .tickets {
      display: grid;
      gap: 16px;
    }

    .ticket {
      background: rgba(23, 20, 39, 0.9);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 20px rgba(12, 10, 22, 0.28);
    }

    .ticket-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .status {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status.open { background: rgba(245, 158, 11, 0.12); color: #f9c76b; }
    .status.in_progress { background: rgba(124, 92, 255, 0.14); color: #d7cbff; }
    .status.resolved { background: rgba(31, 157, 100, 0.15); color: #8ee6b8; }

    .messages {
      display: grid;
      gap: 10px;
      margin: 12px 0;
    }

    .message {
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(124, 92, 255, 0.05);
      color: var(--text);
    }

    .reply-box {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .reply-box input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.96rem;
      background: var(--input-bg);
      color: var(--text);
    }

    .reply-box input::placeholder {
      color: var(--muted);
    }

    .reply-box button {
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: #fff;
      font-weight: 700;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
    }

    .empty {
      padding: 22px;
      border-radius: 14px;
      background: rgba(23, 20, 39, 0.9);
      border: 1px dashed var(--border);
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 820px) {
      .stats { grid-template-columns: repeat(2, minmax(150px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <div>
        <strong>ALUGAKI</strong>
        <div style="color: var(--muted); margin-top: 4px;">Painel interno de suporte</div>
      </div>
      <a href="index.html" style="text-decoration: none; color: var(--primary); font-weight: 700;">Voltar ao site</a>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Total</div>
        <div id="stat-total" class="stat-value">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Abertas</div>
        <div id="stat-open" class="stat-value">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Em andamento</div>
        <div id="stat-in-progress" class="stat-value">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Resolvidas</div>
        <div id="stat-resolved" class="stat-value">0</div>
      </div>
    </div>

    <div id="tickets" class="tickets"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/support-admin.js"></script>
</body>
</html>
