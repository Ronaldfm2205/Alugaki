<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suporte ALUGAKI</title>
  <style>
    :root {
      --bg: #0f0d1b;
      --bg-soft: #171427;
      --surface: #171427;
      --surface-elevated: #1e1b31;
      --surface-strong: rgba(124, 92, 255, 0.12);
      --primary: #7c5cff;
      --primary-strong: #9a7dff;
      --primary-dark: #6a4ae6;
      --text: #f4f1ff;
      --muted: #b7afd8;
      --border: rgba(255, 255, 255, 0.08);
      --success: #1f9d64;
      --warning: #f59e0b;
      --danger: #dc2626;
      --input-bg: #120f1d;
      --bubble-user: linear-gradient(135deg, #7c5cff, #9a7dff);
      --bubble-system: #221d38;
      --shadow: rgba(12, 10, 22, 0.45);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #1c1730 0%, var(--bg) 42%);
      color: var(--text);
    }

    .shell {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 16px 48px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(23, 20, 39, 0.88);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px 20px;
      box-shadow: 0 8px 24px var(--shadow);
      margin-bottom: 24px;
      backdrop-filter: blur(10px);
    }

    .brand {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary-strong);
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      box-shadow: 0 10px 20px rgba(124, 92, 255, 0.25);
    }

    .chat-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr);
      gap: 24px;
    }

    .panel {
      background: rgba(23, 20, 39, 0.9);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 8px 24px var(--shadow);
      overflow: hidden;
    }

    .chat-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(124, 92, 255, 0.12), rgba(23, 20, 39, 0.9));
    }

    .chat-title {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    .chat-subtitle {
      margin: 0;
      color: var(--muted);
    }

    .messages {
      height: 520px;
      overflow-y: auto;
      padding: 20px;
      background: rgba(10, 9, 17, 0.7);
    }

    .message {
      max-width: 76%;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.5;
    }

    .message.user {
      background: var(--bubble-user);
      color: #fff;
      margin-left: auto;
      border-bottom-right-radius: 6px;
    }

    .message.bot,
    .message.support {
      background: var(--bubble-system);
      color: var(--text);
      border-bottom-left-radius: 6px;
    }

    .message-meta {
      display: block;
      font-size: 0.75rem;
      opacity: 0.8;
      margin-bottom: 6px;
    }

    .composer {
      display: flex;
      gap: 12px;
      padding: 16px 20px 20px;
      border-top: 1px solid var(--border);
      background: rgba(23, 20, 39, 0.9);
    }

    .composer input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
      background: var(--input-bg);
      color: var(--text);
    }

    .composer input::placeholder {
      color: var(--muted);
    }

    .composer button {
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(124, 92, 255, 0.25);
    }

    .support-card {
      padding: 20px;
    }

    .quick-help {
      display: grid;
      gap: 10px;
      margin-top: 24px;
    }

    .help-item {
      background: rgba(124, 92, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(124, 92, 255, 0.12);
      color: #d7cbff;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    @media (max-width: 820px) {
      .chat-layout { grid-template-columns: 1fr; }
      .messages { height: 420px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">ALUGAKI · Suporte</div>
      <a class="link-btn" href="index.html">Voltar para a página inicial</a>
    </div>

    <div class="chat-layout">
      <section class="panel">
        <div class="chat-header">
          <div class="badge">Atendimento em tempo real</div>
          <h1 class="chat-title">Como podemos ajudar?</h1>
          <p class="chat-subtitle">Envie sua dúvida e o chatbot irá orientar sua solicitação.</p>
        </div>

        <div id="support-messages" class="messages" aria-live="polite"></div>

        <form id="support-form" class="composer">
          <input id="support-message" type="text" maxlength="1000" placeholder="Digite sua pergunta ou problema..." required />
          <button type="submit">Enviar</button>
        </form>
      </section>

      <aside class="panel support-card">
        <div class="badge">Ajuda rápida</div>
        <h2>Problemas comuns</h2>
        <div class="quick-help">
          <div class="help-item" data-message="Como cancelar uma reserva?"><span>Cancelar reserva</span></div>
          <div class="help-item" data-message="Como pagar a locação?"><span>Pagamento</span></div>
          <div class="help-item" data-message="Como funciona a retirada do item?"><span>Retirada e entrega</span></div>
          <div class="help-item" data-message="Como aumentar a segurança da conta?"><span>Segurança</span></div>
        </div>
      </aside>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/support.js"></script>
</body>
</html>
